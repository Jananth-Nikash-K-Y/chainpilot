# ChainPilot — foundation-phase compose file.
#
# The backend uses SQLite (a single file inside the backend container volume),
# so there is no database service to run. Add a `postgres` service here and
# point DATABASE_URL at it if/when the project outgrows SQLite.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainpilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./chainpilot.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainpilot-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
